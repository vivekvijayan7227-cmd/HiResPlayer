name: HiResPlayer CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Verify (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore HiResPlayer.sln

    - name: Build Managed Solution (Release)
      run: dotnet build HiResPlayer.sln -c Release --no-restore

    - name: Run Managed Unit & Integration Tests
      run: dotnet test tests/ManagedTests/HiResPlayer.Tests.csproj -c Release --no-build --verbosity normal
