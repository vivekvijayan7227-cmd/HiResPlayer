name: HiResPlayer CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install libFLAC via vcpkg
      shell: powershell
      run: |
        $env:VCPKG_ROOT = $null
        vcpkg install libflac:x64-windows --vcpkg-root "C:\vcpkg"
        Add-Content $env:GITHUB_PATH "C:\vcpkg\installed\x64-windows\bin"

    - name: Build Native Audio Engine from C++ Source
      shell: powershell
      run: |
        $env:FLAC_ROOT = "C:\vcpkg\installed\x64-windows"
        powershell -ExecutionPolicy Bypass -File HiResPlayer/scripts/build_engine.ps1 -Clean

    - name: Clear conflicting MSVC Platform variable
      shell: powershell
      run: |
        "Platform=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore Managed Solution
      shell: powershell
      run: |
        Remove-Item Env:\Platform -ErrorAction SilentlyContinue
        dotnet restore HiResPlayer/HiResPlayer.slnx

    - name: Build Managed Solution (Release)
      shell: powershell
      run: |
        Remove-Item Env:\Platform -ErrorAction SilentlyContinue
        dotnet build HiResPlayer/HiResPlayer.slnx -c Release --no-restore

    - name: Run Unit & Integration Tests (Release)
      shell: powershell
      run: |
        Remove-Item Env:\Platform -ErrorAction SilentlyContinue
        dotnet test HiResPlayer/tests/ManagedTests/HiResPlayer.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: HiResPlayer/tests/ManagedTests/TestResults/*.trx

    - name: Package Release Distribution
      shell: powershell
      run: |
        Remove-Item Env:\Platform -ErrorAction SilentlyContinue
        powershell -ExecutionPolicy Bypass -File HiResPlayer/scripts/publish.ps1 -Configuration Release

    - name: Build Standalone Setup Installer
      shell: powershell
      run: |
        Remove-Item Env:\Platform -ErrorAction SilentlyContinue
        powershell -ExecutionPolicy Bypass -File HiResPlayer/scripts/build_installer.ps1 -Configuration Release -Version 1.0.1

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HiResPlayer-Setup-v1.0.1
        path: |
          Installer/*.exe
          HiResPlayer/Installer/*.exe
